<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>SIR. - Notices</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=2026050901">
    <style>
        .notice-container {
            padding: 120px 4rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 80vh;
        }
        .notice-header {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
        }

        /* Carousel Styles */
        #carousel-container {
            width: 100%;
            height: 450px;
            overflow: hidden;
            position: relative;
            margin-bottom: 4rem;
            background: #000;
            border-radius: 8px;
        }
        .notice-carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .notice-carousel-slide {
            height: 100%;
            position: relative;
            flex-shrink: 0;
        }
        .notice-carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }
        .notice-carousel-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
            padding: 3rem 2rem 2rem;
        }
        .notice-carousel-overlay h2 { font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 500; }
        .notice-carousel-overlay p { font-size: 0.95rem; opacity: 0.8; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Grid Styles */
        .notice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }
        .notice-card {
            border: 1px solid #eaeaea;
            transition: transform 0.2s;
            cursor: pointer;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }
        .notice-card:hover { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
        .notice-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f5f5f5;
        }
        .notice-card-body { padding: 1.5rem; }
        .notice-card-date { font-size: 0.8rem; color: #888; margin-bottom: 0.6rem; letter-spacing: 0.05em; }
        .notice-card-title { font-size: 1.15rem; font-weight: 500; margin-bottom: 0.6rem; color: #111; }
        .notice-card-content { font-size: 0.9rem; color: #666; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
    <header id="main-header" class="luxury-header" style="background-color: rgba(255, 255, 255, 0.95); color: #111; text-shadow: none;">
        <div class="header-inner">
            <div class="header-logo-row">
                <a href="index.html" class="logo" style="color: #111; font-weight: 400;">SIR.</a>
                <div class="header-right">
                    <a href="notice.html">NOTICE</a>
                    <a href="#">ACCOUNT</a>
                    <a href="#" id="cart-trigger">CART (<span id="cart-count">0</span>)</a>
                    <a href="admin.html" style="color: #d93025;">[ADMIN]</a>
                </div>
            </div>
            <nav class="header-nav-row" id="dynamic-nav">
                <a href="index.html">SHOP</a>
                <a href="index.html">NEW ARRIVALS</a>
                <a href="index.html" class="nav-highlight">YES SIR.</a>
            </nav>
        </div>
    </header>

    <main class="notice-container">
        <h1 class="notice-header">Notice Board</h1>
        
        <!-- Auto-flowing Carousel for Top 3 -->
        <div id="carousel-container"></div>

        <!-- Grid for All Notices -->
        <div id="notices-list"></div>
    </main>

    <div id="global-footer-container"></div>

    <script type="module" src="assets/js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const settings = await getSettings();

            const listContainer = document.getElementById('notices-list');
            const carouselContainer = document.getElementById('carousel-container');
            let notices = settings.noticesBoard || [];
            
            if(notices.length === 0) {
                carouselContainer.style.display = 'none';
                listContainer.innerHTML = '<p style="text-align:center; padding: 4rem; color: #999;">?�록??공�??�항???�습?�다.</p>';
                return;
            }

            // 최신???�렬 (?�짜 ?�림차순, 같으�?id ?�림차순)
            notices.sort((a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id);
            
            // 최�? 3�?캐러?� ?�더�?            const topPosts = notices.slice(0, 3);
            if (topPosts.length > 0) {
                const trackWidth = topPosts.length * 100;
                const slideWidth = 100 / topPosts.length;
                
                let trackHtml = `<div class="notice-carousel-track" id="carousel-track" style="width: ${trackWidth}%;">`;
                topPosts.forEach((n, idx) => {
                    // ?��?지가 ?�으�??�레?�스?�???�용
                    const imgSrc = n.image || `https://picsum.photos/1200/500?random=${n.id}`;
                    trackHtml += `
                        <div class="notice-carousel-slide" style="width: ${slideWidth}%;">
                            <img src="${imgSrc}" alt="${n.title}">
                            <div class="notice-carousel-overlay">
                                <div style="color:#ddd; font-size:0.85rem; margin-bottom:0.3rem;">${n.date} <span style="background:#d93025; color:#fff; padding:2px 6px; border-radius:3px; margin-left:8px; font-size:0.7rem; font-weight:bold;">LATEST</span></div>
                                <h2>${n.title}</h2>
                                <p>${n.content}</p>
                            </div>
                        </div>
                    `;
                });
                trackHtml += '</div>';
                carouselContainer.innerHTML = trackHtml;

                // ?�동 ?�름 로직 (Auto Slide)
                if (topPosts.length > 1) {
                    let currentIndex = 0;
                    setInterval(() => {
                        currentIndex = (currentIndex + 1) % topPosts.length;
                        const offset = currentIndex * slideWidth;
                        document.getElementById('carousel-track').style.transform = `translateX(-${offset}%)`;
                    }, 4000);
                }
            } else {
                carouselContainer.style.display = 'none';
            }

            // 갤러�?그리???�더�?            listContainer.innerHTML = '<div class="notice-grid">' + notices.map(n => `
                <div class="notice-card">
                    <img src="${n.image || `https://picsum.photos/400/300?random=${n.id}`}" alt="${n.title}">
                    <div class="notice-card-body">
                        <div class="notice-card-date">${n.date}</div>
                        <div class="notice-card-title">${n.title}</div>
                        <div class="notice-card-content">${n.content}</div>
                    </div>
                </div>
            `).join('') + '</div>';
        });
    </script>
</body>
</html>
