<div class="admin-header">
    <h2>게시판 및 콘텐츠 관리</h2>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem;">
    <button class="btn" id="subtab-notices" style="background: #111; color: #fff;">공지사항 관리</button>
    <button class="btn" id="subtab-footer" style="background: #f5f5f5; color: #333; border: 1px solid #ddd;">하단 푸터(Footer) 메뉴 및 정보 페이지 관리</button>
    <button class="btn" id="subtab-perks" style="background: #f5f5f5; color: #333; border: 1px solid #ddd;">브랜드 해시태그 및 하단 혜택 관리</button>
</div>

<!-- 공지사항 뷰 -->
<div id="subview-notices">
    <div class="admin-card" style="padding-bottom: 1rem;">
        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">1. 구매자 전달용 공지사항 게시판 (Notice Board)</h3>
        <p class="admin-desc" style="margin-bottom: 1rem;">스토어의 공지사항 노출 관리 및 메인 화면 상단 띠 배너 흐름 속도를 통합 제어합니다.</p>
        <div id="notice-board-container"></div>
    </div>
</div>

<!-- 푸터 뷰 -->
<div id="subview-footer" style="display: none;">
    <div class="admin-card" style="padding-bottom: 1rem;">
        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">2. 하단 푸터(Footer) 메뉴 및 정보 페이지 관리</h3>
        <p class="admin-desc" style="margin-bottom: 1rem;">푸터 메뉴 카테고리를 제어하고, 각 항목의 상세 콘텐츠(이용약관, FAQ 등)를 수정합니다.</p>
        <div id="footer-board-container"></div>
        <button class="btn" id="save-footer-btn" style="margin-top: 1rem;">푸터 구조 통합 저장</button>
    </div>
</div>

<!-- 혜택 뷰 -->
<div id="subview-perks" style="display: none;">
    <div class="admin-card" style="padding-bottom: 1rem;">
        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">3. 브랜드 해시태그 및 하단 혜택 (Perks) 섹션 관리</h3>
        <div class="form-group" style="margin-bottom: 1.5rem; max-width: 300px;">
            <label>메인 브랜드 해시태그 (프론트 노출 항목명)</label>
            <input type="text" id="perks-hashtag-input" class="form-control" placeholder="예: #MYBRAND">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;" id="perks-container">
            <div class="form-group">
                <label>혜택 1 제목</label>
                <input type="text" class="form-control" value="">
                <label style="margin-top:0.5rem;">설명</label>
                <input type="text" class="form-control" value="">
            </div>
            <div class="form-group">
                <label>혜택 2 제목</label>
                <input type="text" class="form-control" value="">
                <label style="margin-top:0.5rem;">설명</label>
                <input type="text" class="form-control" value="">
            </div>
            <div class="form-group">
                <label>혜택 3 제목</label>
                <input type="text" class="form-control" value="">
                <label style="margin-top:0.5rem;">설명</label>
                <input type="text" class="form-control" value="">
            </div>
        </div>
        <button type="button" class="btn" id="save-perks-btn" style="margin-top: 1rem;">하단 혜택 저장</button>
    </div>
</div>
