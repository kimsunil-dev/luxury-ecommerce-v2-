<div class="admin-header">
    <h2>고객 회원가입 기록 관리</h2>
</div>
<p class="admin-desc">프론트엔드에서 LOGIN/SIGN UP을 통해 가입한 고객 명단입니다.</p>
<div class="dashboard-stats" style="grid-template-columns: 1fr 1fr;">
    <div class="stat-card">
        <div class="stat-title">총 가입 회원</div>
        <div class="stat-value" id="member-total-count" style="color: #03c75a;">0명</div>
    </div>
    <div class="stat-card">
        <div class="stat-title">이번 주 신규 가입</div>
        <div class="stat-value" id="member-new-count">0명</div>
    </div>
</div>

<div class="admin-card" style="padding: 0;">
    <table class="admin-table">
        <thead>
            <tr>
                <th>가입일시</th>
                <th>이름</th>
                <th>이메일 (아이디)</th>
                <th>마케팅 수신동의</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody id="member-table-body">
            <!-- Members injected by JS -->
        </tbody>
    </table>
</div>
